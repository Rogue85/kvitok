# The project website on GitHub Pages: site/ plus the brand, diagrams and screenshots from docs/.
# Rebuilt when any of them changes on main, and on a release, which changes the version shown.
name: Website

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/brand/**
      - docs/diagrams/**
      - docs/screenshots/**
      - scripts/build-site.mjs
      - package.json
      - .github/workflows/pages.yml
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
