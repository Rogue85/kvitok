- key: loyalty
  title: Лояльность
  description: Баллы и кэшбек, уровни, акции и купоны, «6-я кружка в подарок», чек не проведён по карте.
  examples:
    - Купила латте, баллы не начислились
    - Не засчитали кружку в акцию, купон на бесплатный кофе не пришёл
- key: app
  title: Приложение
  description: Ошибки приложения, вход и коды подтверждения, пуши, отображение меню, смена телефона, удаление аккаунта.
  examples:
    - Не приходит код для входа
    - Приложение вылетает при открытии меню
- key: stores
  title: Кофейни
  description: Работа кофеен — качество напитков и еды, персонал, очереди, часы работы, забытые вещи, заказы самовывоза и возвраты за них.
  examples:
    - Кофе был горький, бариста грубил
    - Оплатил заказ в приложении, а кофейня закрыта
