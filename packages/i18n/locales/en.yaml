      fail: On iPhone and iPad notifications come only to an app added to the Home Screen (iOS 16.4 or later).
      step1: Open this page in Safari.
      step2: Tap Share at the bottom of the screen.
      step3: Choose “Add to Home Screen” and confirm.
      step4: Open Kvitok from the Home Screen, sign in and turn on notifications on this page.
