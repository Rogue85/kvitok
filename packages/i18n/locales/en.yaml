      title: Permission
      ok: Notifications are allowed
      pending: The browser asks for permission when you turn notifications on
      fail: Notifications are blocked for this site.
      reset:
        chrome: Click the icon to the left of the address, open the site settings, set “Notifications” to “Allow” and reload the page.
        safari: "Open Safari → Settings → Websites → Notifications, allow this site and reload the page."
        ios: "Open Settings → Notifications → Kvitok and turn on “Allow Notifications”."
        firefox: Click the icon to the left of the address, remove the block on notifications and reload the page.
        generic: Allow notifications for this site in the browser's site settings and reload the page.
    subscribed:
      title: Subscription
      ok: Notifications come to this device
      pending: Notifications are not turned on on this device yet
  system:
    title: The test notification did not appear?
    macos: Check System Settings → Notifications → your browser, and that Focus is off.
    windows: Check Settings → System → Notifications for your browser, and that Do Not Disturb is off.
    android: Check that the browser may show notifications in the Android settings and that battery saving does not stop it.
    ios: Check Settings → Notifications → Kvitok, and that Focus is off.
    linux: Check that notifications of your desktop are on and Do Not Disturb is off.
    generic: Check that the operating system allows the browser to show notifications.
